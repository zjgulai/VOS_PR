    claimType: operational-rule
    risk: medium
    verification: cross-audit-verified
    crossAuditNote: Hootsuite + Sprout 两源一致
    evidenceGrade: L1-public-or-runtime
    asOf: "2026-08-13"
    sourceRefs: [SRC-HOOTSUITE-COMPETITOR-ANALYSIS, SRC-SPROUT-COMPETITOR-LISTENING]
    applicability: 直接用于 S2 竞品监控模块的 KPI 定义和周报指标。
    limitations: SOV 计算依赖采集覆盖的完整性，需诚实标注采集范围。

