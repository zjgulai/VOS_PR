    limitations: Attribution 难以精确追踪（多点触达），EMV 是估算非实际值。


  # ── Phase B 研究包4：Facebook Groups ──────────────────────────
  - claimId: CLM-SI-FB-001
    statement: Facebook Groups 1.8 亿/月活跃用户，25M+ 公开群。FB Groups 有机覆盖率远高于 Pages（Pages 仅触达 1-5% followers，Groups 通知驱动直接入 feed）。母婴 FB Groups 是家长获取同伴支持和产品信息的核心渠道。
    claimType: market-fact
    risk: low
    verification: cross-audit-verified
    crossAuditNote: Hootsuite + Brandlix + GroupsWatcher 三源一致
    evidenceGrade: L1-public-or-runtime
    asOf: "2026-08-13"
    sourceRefs: [SRC-HOOTSUITE-FBGROUPS, SRC-BRANDLIX-FBGROUPS]
    applicability: 支撑 FB Groups 作为 S1 用户讨论重点监测平台的战略价值。
    limitations: 数据为全平台，母婴垂类需单独验证。

  - claimId: CLM-SI-FB-002
    statement: 大多数 social listening 工具只能监测公开 Facebook Pages，无法监测 Facebook Groups（API 受限）。私密 Groups = 最真实讨论发生地。专用工具（如 Groups Watcher）可监测公开+私密群，但需核查 ToS 合规性。
    claimType: operational-rule
    risk: high
    verification: cross-audit-verified
    crossAuditNote: GroupsWatcher + The Conversation + ABC News 三源确认 FB Groups 监测有 API 限制 + 私密群价值
    evidenceGrade: L1-public-or-runtime
    asOf: "2026-08-13"
    sourceRefs: [SRC-GROUPSWATCHER-MONITORING, SRC-ABCNEWS-MUMS-GROUP]
    applicability: 直接写入覆盖缺口 SOP：FB Groups 是 B 型缺口（ToS 限制），标注为部分覆盖。
    limitations: 私密群监测在不同工具、不同辖区有不同合规风险，需法务确认。

  - claimId: CLM-SI-FB-003
    statement: 母婴 FB Groups 存在商业化黑幕风险：admin 可能是商业公司，帖子以赞助形式变现但对成员不透明。高信任社区 = 高商业影响风险。品牌进入需检查：admin 背景/group rules 是否提及商业/成员是否含 Pages/赞助帖是否标注。
    claimType: operational-rule
    risk: critical
    verification: cross-audit-verified
    crossAuditNote: ABC News（澳洲 Canberra Mums 案例）+ The Conversation（学术分析）两源一致
    evidenceGrade: L1-public-or-runtime
    asOf: "2026-08-13"
    sourceRefs: [SRC-ABCNEWS-MUMS-GROUP, SRC-CONVERSATION-PARENTING-GROUPS]
    applicability: Creator/Group 合作前需做尽职调查；Momcozy 如果赞助母婴群组内容，必须确保赞助标注透明（FTC 合规）。
    limitations: 主要来自澳洲案例，美国 ToS 和 FTC 要求可能不同。

  # ── Phase B 研究包5：竞品内容情报 ──────────────────────────────
